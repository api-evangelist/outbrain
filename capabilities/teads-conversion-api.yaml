naftiko: 1.0.0-alpha2
info:
  label: Teads Conversion API — Server-Side Events
  description: 'Teads / Outbrain combined Conversion API. Submit server-side conversion events (Purchase, Lead,
    AddToCart, etc.) directly from the advertiser backend for measurement, optimization, and cookieless
    attribution.'
  tags:
  - Teads
  - Outbrain
  - Conversion API
  - Server Side
  - Measurement
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    TEADS_CAPI_TOKEN: TEADS_CAPI_TOKEN
capability:
  consumes:
  - type: http
    namespace: teads-conversion
    baseUri: https://r.teads.tv
    resources:
    - name: capi-event
      path: /capi/event
      operations:
      - name: sendconversionevent
        method: POST
        description: Send a server-side conversion event.
    - name: capi-event-batch
      path: /capi/event/batch
      operations:
      - name: sendconversioneventbatch
        method: POST
        description: Send up to 1000 events in one request.
    authentication:
      type: bearer
      value: '{{env.TEADS_CAPI_TOKEN}}'
      placement: header
  exposes:
  - type: mcp
    namespace: teads-conversion-mcp
    port: 9090
    transport: http
    tools:
    - name: teads-send-conversion-event
      description: Send a server-side conversion event.
      call: teads-conversion.sendconversionevent
    - name: teads-send-conversion-event-batch
      description: Send a batch of conversion events.
      call: teads-conversion.sendconversioneventbatch
