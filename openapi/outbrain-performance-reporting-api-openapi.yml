  /reports/marketers/{id}/promotedContent:
    get:
      operationId: getReportsMarketersIdPromotedContent
      summary: Retrieve promoted content links performance statistics for a Marketer
      description: 'The API in this sub-section allows retrieving performance statistics by promoted link at different levels: marketer, budget, campaign and promoted link.


        This new endpoint also supports promoted links that are creative format: CAROUSEL and APP_INSTALL, these were previously excluded from the original Content endpoint. Please note that this endpoint is replacing the previous Content endpoint which will be removed by October 2022.


        Result fields

        Metrics in metrics, metadata in a metadata object containing the following fields:


        Property

        Type

        Semantic


        id

        String

        The ID of the PromotedLink.


        sequenceId

        String

        The ID of the PromotedLinkSequence.


        title

        String

        The title of the PromotedLink.


        creationTime

        Date

        The time when the PromotedLink was created.


        lastModified

        Date

        The time when the PromotedLink was last modified.


        url

        String

        The URL visitors will be sent to upon clicking the PromotedLink.


        status

        PromotedLink Review Status

        Deprecated, use approvalStatus instead. The review status of the PromotedLink.


        approvalStatus

        PromotedLink Approval Status

        The approval status of the PromotedLink.


        enabled

        Boolean

        Will this PromotedLink be served.


        cachedLogoUrl

        String

        The URL of the PromotedLink''s logo image, cached on Outbrain''s servers.


        campaignId

        String

        The ID of the campaign to which the PromotedLink belongs.


        campaignName

        String

        The name of the campaign to which the PromotedLink belongs.


        sectionName

        String

        The section name of the site the PromotedLink URL points to.


        cpcAdjustment

        Number

        CPC adjustment bid of this PromotedLink for campaign given by the campaignId parameter (optional).


        creativeFormat

        Campaign creative format

        The creative format of the campaign to which the PromotedLink belongs to.


        imageMetadata

        Image Meta Data

        PromotedLink''s image metadata


        metadata

        String

        non-serving reference name of the PromotedLink (optional)


        Special request parameters


        Parameter

        Type

        Semantic

        Details


        promotedLinkId

        String

        Limit to data of the promoted link with given ID

        Optional, takes precedence over budgetId and campaignId


        sequenceId

        String

        Limit to data of the promoted link sequence with given ID

        Optional, takes precedence over budgetId and campaignId


        limit

        Number

        Maximal number of results to return.

        Optional, default 10, maximal value 1000'
      tags:
      - Performance Reporting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Marketer id
        example: abf4b02153ee75f3cadc4fc128ab0419ab
      - name: from
        in: query
        required: true
        schema:
          type: string
        description: Start day Date
        example: '2015-12-22'
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: End day Date
        example: '2016-01-20'
      - name: limit
        in: query
        required: false
        schema:
          type: number
        description: Number of results to return in this request. Used with offset for pagination. default is 10.
        example: '10'
      - name: offset
        in: query
        required: false
        schema:
          type: number
        description: Result number to start this response at. zero based. Used with limit for pagination. default is 0.
        example: '3'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: Can have one of the following values impressions, clicks, ctr, spend, ecpc, conversions, conversionRate, cpa, text, creationTime, lastModified, url, status, approvalStatus, enabled, campaignName, cpcAdjustment, creativeFormat. For more details about reports filtering read this.
        example: -ctr
      - name: filter
        in: query
        required: false
        schema:
          type: string
        description: Can have the following values impressions, clicks, ctr, spend, ecpc, conversions, conversionRate, cpa, text, creationTime, lastModified, url, status, approvalStatus, enabled, campaignName, cpcAdjustment, creativeFormat. For more details about reports filtering read this.
        example: clicks+gt+99
      - name: includeArchivedCampaigns
        in: query
        required: false
        schema:
          type: boolean
        description: Include data of archived campaigns, default false.
        example: 'true'
      - name: budgetId
        in: query
        required: false
        schema:
          type: string
        description: Limit to data of the budget with the given ID.
        example: adc4fc128ab0419ababf4b02153ee75f3c
      - name: campaignId
        in: query
        required: false
        schema:
          type: string
        description: Limit to data of the campaign with the given IDs (takes precedence over budgetId).
        example: e75f3cadc4fc128ab0419ababf4b02153e, 0069fc0fe9598f99b4c528f0881cd74b4b
      - name: promotedLinkId
        in: query
        required: false
        schema:
          type: string
        description: Limit to data of the promoted link with the given ID (takes precedence over budgetId and campaignId).
        example: 19ababf4b02153ee75f3cadc4fc128ab04
      - name: includeConversionDetails
        in: query
        required: false
        schema:
          type: boolean
        description: Include metrics of conversion pixels, default false.
        example: 'false'
      - name: conversionsByClickDate
        in: query
        required: false
        schema:
          type: boolean
        description: Report conversion metrics by click or conversion date, default false (report by conversion date).
        example: 'true'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
