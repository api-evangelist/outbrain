  /reports/marketers/{id}/sections:
    get:
      operationId: getReportsMarketersIdSections
      summary: Retrieve performance statistics for a Marketer by section
      description: 'Section: A specific content section within the publisher''s site such as sports, business etc.


        The API in this sub-section allows retrieving marketer performance statistics with breakdown by section with sections that are already blocked at the marketer or campaign level.


        Note: Sections with less than 1 click or less than 10 impressions will not show up in the results.


        Result Fields

        Metrics in metrics, metadata in a metadata object containing the following fields:


        Property

        Type

        Semantic


        id

        String

        Section Identifier.


        name

        String

        Section Name.


        publisherId

        String

        Identifiers of the publisher related to the section.


        publisherName

        String

        Name of the publisher related to the section.


        cpcAdjustment

        Number

        CPC adjustment bid of this section for campaign given by the campaignId parameter (optional).


        blockStatus

        Block status

        Blocking status of the section.


        blockTypes

        Block types

        Block types and their value for the section.


        publisherUrl

        String

        URL of this section''s publisher (optional).


        isOen

        Boolean

        Is this an OEN (Outbrain Extended Network) section. (Planned removal October 18th)'
      tags:
      - Performance Reporting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Marketer id
        example: abf4b02153ee75f3cadc4fc128ab0419ab
      - name: from
        in: query
        required: true
        schema:
          type: string
        description: Start day Date
        example: '2015-12-22'
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: End day Date
        example: '2016-01-20'
      - name: limit
        in: query
        required: false
        schema:
          type: number
        description: Number of results to return in this request. Used with offset for pagination. default is 10.
        example: '10'
      - name: offset
        in: query
        required: false
        schema:
          type: number
        description: Result number to start this response at. zero based. Used with limit for pagination. default is 0.
        example: '3'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: Can have one of the following values impressions, clicks, ctr, spend, ecpc, conversions, conversionRate, cpa, publisherName, name. For more details about reports filtering read this.
        example: -ctr
      - name: filter
        in: query
        required: false
        schema:
          type: string
        description: Can have the following values impressions, clicks, ctr, spend, ecpc, conversions, conversionRate, cpa, publisherId, publisherName, name. For more details about reports filtering read this.
        example: clicks+gt+99
      - name: includeArchivedCampaigns
        in: query
        required: false
        schema:
          type: boolean
        description: Include data of archived campaigns, default false.
        example: 'true'
      - name: budgetId
        in: query
        required: false
        schema:
          type: string
        description: Limit to data of the budget with the given ID.
        example: adc4fc128ab0419ababf4b02153ee75f3c
      - name: campaignId
        in: query
        required: false
        schema:
          type: string
        description: Limit to data of the campaign with the given IDs (takes precedence over budgetId).
        example: e75f3cadc4fc128ab0419ababf4b02153e, 0069fc0fe9598f99b4c528f0881cd74b4b
      - name: includeConversionDetails
        in: query
        required: false
        schema:
          type: boolean
        description: Include metrics of conversion pixels, default false.
        example: 'false'
      - name: conversionsByClickDate
        in: query
        required: false
        schema:
          type: boolean
        description: Report conversion metrics by click or conversion date, default false (report by conversion date).
        example: 'true'
      - name: includeViewedImpressions
        in: query
        required: false
        schema:
          type: boolean
        description: When true, includes viewableImpressions in the response metrics.
        example: 'false'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                results:
                - metadata:
                    id: 00553b4e7de013f31cf17b98e6e5c9a475
