  /reports/marketers/{id}/campaigns/publishers:
    get:
      operationId: getReportsMarketersIdCampaignsPublishers
      summary: Retrieve performance statistics for all marketer campaigns by publisher
      description: 'A special endpoint for retrieving publishers data by campaign breakdown.


        Note: The response structure defers from other performance responses.


        The reponse contains only campaigns that have publishers results given the offset and limit, in the following two objects:


        Property

        Type

        Semantic


        campaignResults

        Array

        Results for the marketer campaigns. Each object in the array contains results and totalResults field similar to the response of the Publishers request (except for the blockStatus and blockTypes fields in the metadata field of each result), and an additional campaignId field with the campaign ID.


        totalCampaigns

        Number

        Count of the total campaigns in the campaignResults array.'
      tags:
      - Performance Reporting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Marketer id
        example: abf4b02153ee75f3cadc4fc128ab0419ab
      - name: from
        in: query
        required: true
        schema:
          type: string
        description: Start day Date
        example: '2015-12-22'
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: End day Date
        example: '2016-01-20'
      - name: limit
        in: query
        required: false
        schema:
          type: number
        description: Number of results to return in this request for each campaign. default is 10.
        example: '10'
      - name: offset
        in: query
        required: false
        schema:
          type: number
        description: Result number to start this response at. zero based. Used with limit for pagination. default is 0.
        example: '3'
      - name: includeArchivedCampaigns
