  /reports/marketers/{id}/interests:
    get:
      operationId: getReportsMarketersIdInterests
      summary: Retrieve performance statistics for a Marketer by interest
      description: 'The API in this sub-section allows retrieving performance statistics by interest at different levels: marketer and campaign.


        In all other performance reporting endpoints each user action (impression, click or conversion) is

        attributed to a single entity, for example campaign, section or region.


        Interests behave differently, since users can have multiple interests in their Outbrain Interest

        Profile and therefore data repeats between interests. For example, a user may be interested in

        both health and politics and so an impression, click or conversion will be attributed to both interests.

        As a result, the sum of the total interests reported does not represent the actual sum of action taken.


        Therefore, the summary and summaryFiltered metrics are not included in the response of

        interest performance reports.


        Result fields

        Metrics in metrics, metadata in a metadata object containing the following fields:


        Property

        Type

        Semantic


        id

        String

        Interest id.


        name

        String

        The name of the interest. Interests with hierarchy are given with a ''>'' symbol separating the interests level, for example ''News > Weather''.


        targetingStatus

        String

        The targeting status of the interest, one of targeted, excluded, notTargeted, partiallyTargeted or partiallyExcluded.'
      tags:
      - Performance Reporting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Marketer id
        example: abf4b02153ee75f3cadc4fc128ab0419ab
      - name: from
        in: query
        required: true
        schema:
          type: string
        description: Start day Date
        example: '2015-12-22'
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: End day Date
        example: '2016-01-20'
      - name: limit
        in: query
        required: false
        schema:
          type: number
        description: Number of results to return in this request. Used with offset for pagination. default is 10.
        example: '10'
      - name: offset
        in: query
        required: false
        schema:
          type: number
        description: Result number to start this response at. zero based. Used with limit for pagination. default is 0.
        example: '3'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: Can have one of the following values impressions, clicks, ctr, spend, ecpc, conversions, conversionRate, cpa, name, enabled, budgetStartDate, budgetEndDate and budgetAmount . For more details about reports filtering read this.
        example: -ctr
      - name: filter
        in: query
        required: false
        schema:
          type: string
        description: Can have the following values impressions, clicks, ctr, spend, ecpc, conversions, conversionRate, cpa, name, enabled, budgetStartDate, budgetEndDate, budgetAmount, budgetType, budgetShared and pacingType. For more details about reports filtering read this.
        example: clicks+gt+99
      - name: includeArchivedCampaigns
        in: query
        required: false
        schema:
          type: boolean
        description: Include data of archived campaigns, default false.
        example: 'true'
      - name: campaignId
        in: query
        required: false
        schema:
          type: string
        description: Limit to data of the campaign with the given IDs (takes precedence over budgetId).
        example: e75f3cadc4fc128ab0419ababf4b02153e, 0069fc0fe9598f99b4c528f0881cd74b4b
      - name: includeConversionDetails
        in: query
        required: false
        schema:
          type: boolean
        description: Include metrics of conversion pixels, default false.
        example: 'true'
      - name: conversionsByClickDate
        in: query
        required: false
        schema:
          type: boolean
        description: Report conversion metrics by click or conversion date, default false (report by conversion date).
        example: 'true'
      - name: includeViewedImpressions
        in: query
        required: false
        schema:
          type: boolean
        description: When true, includes viewableImpressions in the response metrics.
        example: 'false'
