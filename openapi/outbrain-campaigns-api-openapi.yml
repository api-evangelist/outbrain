    put:
      operationId: updateCampaigns
      summary: Update Multiple Campaigns
      description: '-

        You can update as much as 25 multiple campaigns at once


        -

        some campaign properties require using the Extra Field notion


        Notes regarding the request:


        The request should be an array of objects that includes:


        -

        id - the campaign''s id you want to update


        -

        the properties you want to update, same as for a single campaign


        Notes regarding the response:


        Since some campaigns update may succeed and some may fail, the response is constructed as follows:


        -

        operationStatus - OperationStatus


        -

        id - the campaign''s id


        -

        campaign - The recent updated campaign (if the response is successful)'
      tags:
      - Campaigns
      parameters:
      - name: extraFields
        in: query
        required: false
        schema:
          type: string
        description: the additional campaign fields you want to include in the response
        example: CustomAudience,Locations,InterestsTargeting,BidBySections,BlockedSites,PlatformTargeting,CampaignOptimization,Scheduling,IABCategories,CampaignPixels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
            - id: 00f863c5674af5c5f63415500f699a04e5
              name: new campaign name
            - id: 00edb86a9edd703c67af97b31466188e56
              cpc: 0.5
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
              - operationStatus:
                  status: Success
                id: 00f863c5674af5c5f63415500f699a04e5
