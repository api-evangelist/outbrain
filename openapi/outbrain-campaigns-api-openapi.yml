    put:
      operationId: updateCampaignsId
      summary: Update an Existing Campaign
      description: 'To update a campaign send a JSON with the updated value for one or more of the updatable campaign attributes.


        All attribute values left unset in this PUT will remain unchanged.


        Only the following Campaign properties are updatable:


        -

        name - Maximum length is 100 characters


        -

        enabled


        -

        cpc - The cpc must be higher than the minimumCpc


        -

        targeting.platform - See Targeting object


        -

        targeting.locations - See Targeting object


        -

        targeting.excludedLocations - See Targeting object


        -

        targeting.language - See Targeting object


        -

        targeting.excludeAdBlockUsers - See Targeting object


        -

        targeting.operatingSystems - See Targeting object


        -

        targeting.browsers - See Targeting object


        -

        targeting.network - See Targeting object


        -

        suffixTrackingCode - Tracking code parameters that will be appended to the Campaign''s PromotedLinks. Use the value "EMPTY_SUFFIX" to delete.


        -

        prefixTrackingCode - A marketer''s prefix for a PromotedLink. The prefixTrackingCode must be in a valid url form and must end with some parameter followed by an equals sign. Use the value "EMPTY_PREFIX" to delete.


        -

        cpcPerAdEnabled (deprecation date 20.4.20) - Indicates whether or not the ''Cpc Per Ad'' feature is enabled for this campaign.


        -

        blockedSites - The publishers / sections which should be blocked. Note that this is a full list including publishers / sections which are already blocked.


        -

        startHour - Time (12 hour format: ''HH:MM AM/PM'') of the day when this Campaign should run. For this feature to work, the campaign budget type must be "DAILY" or "AUTOMATIC" it cannot be "Spend_ASAP"


        -

        trackingPixels - Deprecated please use pixel.trackingPixels instead (will be removed in 1.7.2021). Array of Tracking Pixels


        -

        archived - Use value archived to archive campaign. If you wish to unarchive please resend the archived request. Archived campaigns are not returned by the campaigns APIs


        -

        bids - See Bids object


        -

        campaignOptimization - See CampaignOptimization object


        -

        volumeControl - See Volume Control object


        -

        onAirType - See Campaign On Air Type object


        -

        scheduling - See Campaign Scheduling Rules object


        -

        objective - See Campaign Objective object


        -

        pixels - See Pixels object.'
      tags:
      - Campaigns
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: the id of the Campaign
        example: 00f4b02153ee75f3c9dc4fc128ab0411ab
      - name: extraFields
