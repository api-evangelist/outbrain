                    lastModified: '2013-01-14 07:21:16'
                  - sectionId: 000b4b1c9dda9d79fe9ff53e0faefa615d
                    sectionName: Culture
                    publisherId: 00d3a87281bbace0171560533ac547f6cc
                    cpcAdjustment: 0.1
                    campaignId: 00f4b02153ee75f3c9dc4fc128ab041962
