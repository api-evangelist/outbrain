  /campaigns/{campaignId}/promotedLinksSequences:
    post:
      operationId: createCampaignsCampaignIdPromotedLinksSequences
      summary: Create a PromotedLinkSequence
      description: 'You can create a new promoted links sequence and associate it with an existing campaign.


        POST a JSON hash with the following attributes:


        -

        title - Optional for carousels only


        -

        enabled - mandatory


        -

        logoUrl - mandatory


        -

        sponsor - mandatory


        -

        promotedLinks - mandatory, See Sub Promoted Link Object


        -

        ratingEnabled - optional for app install only, false by default'
      tags:
      - PromotedLinksSequences
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
        description: The Id of the Campaign
        example: campaignId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              title: title
              enabled: true
              logoUrl: logoUrl
              sponsor: sponsor
              promotedLinks:
              - id: 00b38b4ab4c5490bf8fe707c5448d77b56
                sequenceSettings:
