    get:
      operationId: getCampaignsCampaignIdPromotedLinksSequences
      summary: List PromotedLinksSequences for Campaign
      description: 'Collection of all PromotedLinksSequences for the specified Campaign.

        Results can be filtered by supplying additional query parameters.


        The PromotedLinksSequences collection resource has the following attributes:


        -

        sequences - Array of Promoted Links Sequence.


        -

        count - Number of PromotedLinksSequences returned in the sequences array included in this response.


        -

        totalCount - Total number of PromotedLinksSequence regardless of ''limit'' and ''offset'' parameters, used for pagination.'
      tags:
      - PromotedLinksSequences
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
        description: The Id of the Campaign
        example: abf4b02153ee75f3cadc4fc128ab0419ab
      - name: onAir
        in: query
        required: false
        schema:
          type: boolean
        description: filter only on air sequences
        example: 'true'
      - name: limit
        in: query
        required: false
        schema:
          type: number
        description: num of PromotedLinksSequence to retrieve. default is 25. Maximum is 50
        example: '200'
      - name: offset
        in: query
        required: false
        schema:
          type: number
        description: index of the first PromotedLink in the result, zero based. default is 0
        example: '3'
      responses:
        '200':
          description: JSON representation of all PromotedLinksSequences associated with Campaign {id}
          content:
            application/json:
              schema:
                type: object
              example:
                sequences:
                - id: 0022310af9cb6398828bf2abd1445aa9fe
                  campaignId: 009247e650fa2b633751c9d8d21689e626
                  title: title
                  enabled: true
                  onAirStatus:
