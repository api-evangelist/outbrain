  /promotedLinksSequences/{promotedLinksSequenceId}:
    put:
      operationId: updatePromotedLinksSequencesPromotedLinksSequenceId
      summary: Update a PromotedLinkSequence
      description: 'To update a promotedLinkSequence send a JSON with the updated value for one or more of the updatable promotedLinkSequence attributes.


        All attribute values left unset in this PUT will remain unchanged.


        Only the following PromotedLinkSequence properties are updatable:


        -

        title - For carousels only, Maximum length is 150 characters


        -

        enabled


        -

        logoUrl


        -

        sponsor


        -

        promotedLinks - See Sub Promoted Link Object


        -

        ratingEnabled - for app install only'
      tags:
      - PromotedLinksSequences
      parameters:
      - name: promotedLinksSequenceId
        in: path
        required: true
        schema:
          type: string
        description: The Id of the PromotedLinkSequence
        example: promotedLinksSequenceId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              title: new title
              enabled: true
              logoUrl: newLogoUrl
              sponsor: new sponsor
              promotedLinks:
              - id: 00b38b4ab4c5490bf8fe707c5448d77b56
                sequenceSettings:
                  sequenceOrder: 1
              - id: 00d636d8a5019132acc6edf71916da8594
                sequenceSettings:
                  sequenceOrder: 2
              - id: 00ede8c0a39e447ac2247013b0445eecc9
                sequenceSettings:
                  sequenceOrder: 3
