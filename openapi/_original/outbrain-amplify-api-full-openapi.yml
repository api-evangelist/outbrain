  /reports/marketers/{id}/sections/date:
    get:
      operationId: getReportsMarketersIdSectionsDate
      summary: Retrieve performance statistics for all marketer sections by dates
      description: 'Endpoint for retrieving sections data by date in a daily breakdown.


        Note: The response structure defers from other performance responses.


        Note2: Sections with less than 1 click or less than 10 impressions will not show up in the results.


        Property

        Type

        Semantic


        results

        Array

        Results for the daily breakdown. Each object in the array contains date, sections and totalResults field similar to
        the response of the Sections request (except for the cpcAdjustment, blockStatus and blockTypes fields in the metadata
        field of each result).


        total

        Number

        Count of the total sections in the results array. The returned values will be only the paginated data according the
        the offset and limit inputs.'
      tags:
      - Performance Reporting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Marketer id
        example: abf4b02153ee75f3cadc4fc128ab0419ab
      - name: from
        in: query
        required: true
        schema:
          type: string
        description: Start day Date
        example: '2015-12-22'
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: End day Date
        example: '2016-01-20'
      - name: limit
        in: query
        required: false
