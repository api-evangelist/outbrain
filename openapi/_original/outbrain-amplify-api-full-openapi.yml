      description: "You can create a new promoted link and associate it with an existing campaign.\nAmplifyAPi allows you\
        \ to add your own headline, image and section name for the newly created promoted link.\nIf you'd like to set your\
        \ own image, then you can do so by providing an http link for the hosted image or by uploadig an image file.\nif the\
        \ image is not provided, it will be set via our backend crawler.\n\nPOST a JSON hash with the following attributes:\n\
        \n- \ntext - optional, if not provided, the title will be set via our backend crawler.\nNOTE: Outbrain supports the\
        \ ability to include dynamic values in the headline (English-only) for location and day of week.  For more information\
        \ and instructions on the proper syntax please visit: https://www.outbrain.com/help/advertisers/add-content/#dynamic\n\
        \n- \nurl - mandatory\n\n- \nenabled - mandatory\n\n- \ncpcAdjustment - optional\n\n- \nsectionName - optional\n\n\
        - \ndescription - optional\n\n- \nimageMetadata - optional\n\n- id - optional, Outbrain image id in case the image\
        \ has already been uploaded\n- url - optional, http link for the hosted image\n\n- If the image format is mp4, the\
        \ video should be up to 10sec long\n\n- playMode - optional, the image Play Mode type. Relevant to MP4 and GIF image\
        \ types.\n- Determines whether the clip would run once or loop 3 times.\n- cropSettings - optional, array of Crop\
        \ Point. Relevant for Standard images only\n- cropType - optional, the image’s custom Crop Type\n- aiGenerated - optional,\
        \ whether this creative was fully or partially generated or modified by an AI tool\n\n- \nlogoMetadata - optional,\
        \ this PromotedLink's own brand logo. If omitted, the advertiser's Marketer.logoMetadata is copied in as a one-time\
        \ default\n\n- id - optional, Outbrain logo id if already uploaded\n- url - optional, http link for the hosted logo\
        \ image"
