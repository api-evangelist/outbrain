        title

        String

        The title of the PromotedLink.


        creationTime

        Date

        The time when the PromotedLink was created.


        lastModified

        Date

        The time when the PromotedLink was last modified.


        url

        String

        The URL visitors will be sent to upon clicking the PromotedLink.


        status

        PromotedLink Review Status

        Deprecated, use approvalStatus instead. The review status of the PromotedLink.


        approvalStatus

        PromotedLink Approval Status

        The approval status of the PromotedLink.


        enabled

        Boolean

        Will this PromotedLink be served.


        cachedLogoUrl

        String

        The URL of the PromotedLink''s logo image, cached on Outbrain''s servers.


        campaignId

        String

        The ID of the campaign to which the PromotedLink belongs.


        campaignName

        String

        The name of the campaign to which the PromotedLink belongs.


        sectionName

        String

        The section name of the site the PromotedLink URL points to.


        cpcAdjustment

        Number

        CPC adjustment bid of this PromotedLink for campaign given by the campaignId parameter (optional).


        creativeFormat

        Campaign creative format

        The creative format of the campaign to which the PromotedLink belongs to.


        imageMetadata

        Image Meta Data

        PromotedLink''s image metadata


        metadata

        String

        non-serving reference name of the PromotedLink (optional)


        Special request parameters


        Parameter

        Type

        Semantic

        Details


        promotedLinkId

        String

        Limit to data of the promoted link with given ID

        Optional, takes precedence over budgetId and campaignId


        sequenceId

        String

        Limit to data of the promoted link sequence with given ID

        Optional, takes precedence over budgetId and campaignId


        limit

        Number

        Maximal number of results to return.

        Optional, default 10, maximal value 1000'
