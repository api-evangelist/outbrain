  /reports/marketers/{id}/campaigns/{campaignId}/periodicContent:
    get:
      operationId: getReportsMarketersIdCampaignsCampaignIdPeriodicContent
      summary: Retrieve periodic performance statistics by promoted link for a campaign
      description: 'A special endpoint for retrieving periodic data by promoted link breakdown for a given campaign.


        Note: The response structure defers from other performance responses.


        The reponse contains only promoted links that have periodic results given the offset and limit, in the following two
        objects:


        Property

