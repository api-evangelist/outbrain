  /reports/marketers/{id}/platforms:
    get:
      operationId: getReportsMarketersIdPlatforms
      summary: Retrieve performance statistics for a Marketer by platform
      description: 'The API in this sub-section allows retrieving performance statistics by platform at different levels:
        marketer, budget, and campaign.


        Result fields

        Metrics in metrics, metadata in a metadata object containing the following fields:


        Property

        Type

        Semantic


        platform

        String

        The result platform, one of DESKTOP, TABLET or MOBILE.


        breakdown

        String

        The result breakdown, one of os, browser or platform for no breakdown.


        name

        String

        The result breakdown name when breakdown was requested. For example: Chrome for browser breakdown, MacOs for os breakdown.
        All possible options are available here: Operating System, Browser.'
      tags:
      - Performance Reporting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Marketer id
        example: abf4b02153ee75f3cadc4fc128ab0419ab
      - name: from
        in: query
        required: true
        schema:
          type: string
        description: Start day Date
        example: '2015-12-22'
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: End day Date
        example: '2016-01-20'
      - name: limit
        in: query
        required: false
        schema:
          type: number
        description: Number of results to return in this request. Used with offset for pagination. default is 10.
        example: '10'
      - name: offset
        in: query
        required: false
        schema:
          type: number
        description: Result number to start this response at. zero based. Used with limit for pagination. default is 0.
        example: '3'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: Can have one of the following values impressions, clicks, ctr, spend, ecpc, conversions, conversionRate,
          cpa, name, enabled, budgetStartDate, budgetEndDate and budgetAmount . For more details about reports filtering read
          this.
        example: -ctr
      - name: filter
        in: query
        required: false
        schema:
          type: string
        description: Can have the following values impressions, clicks, ctr, spend, ecpc, conversions, conversionRate, cpa,
          name, enabled, budgetStartDate, budgetEndDate, budgetAmount, budgetType, budgetShared and pacingType. For more details
          about reports filtering read this.
        example: clicks+gt+99
      - name: includeArchivedCampaigns
        in: query
        required: false
        schema:
          type: boolean
        description: Include data of archived campaigns, default false.
        example: 'true'
      - name: budgetId
        in: query
        required: false
        schema:
          type: string
        description: Limit to data of the budget with the given ID.
        example: adc4fc128ab0419ababf4b02153ee75f3c
      - name: campaignId
        in: query
        required: false
        schema:
          type: string
