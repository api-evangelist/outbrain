        locationsVersion

        String

        (Optional for region) The region''s inventory. V1 for FIPS and V2 for ISO-3166.


        countryId

        String

        (Optional for region, DMA or subregion) The country id of the specific region, DMA or subregion.


        countryName

        String

        (Optional for region, DMA or subregion) The country name of the specific region, DMA or subregion.


        countryCode

        String

        (Optional for region, DMA or subregion) The country code of the specific region, DMA or subregion.


        regionId

        String

        (Optional for subregion) The region id of the specific subregion.


        regionName

        String

        (Optional for subregion) The region name of the specific subregion.


        regionCode

        String

        (Optional for subregion) The region code of the specific subregion.


        Special request parameters


        Parameter

        Type

        Semantic

        Details


        breakdown

        String

        Defines the geo breakdown of data, either country, region, DMA or subregion.

        Mandatory'
      tags:
      - Performance Reporting
