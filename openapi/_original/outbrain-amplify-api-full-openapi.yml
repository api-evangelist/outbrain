        \ - Tracking code parameters that will be appended to the Campaign's PromotedLinks. Use the value \"EMPTY_SUFFIX\"\
        \ to delete.\n\n- \nprefixTrackingCode - A marketer's prefix for a PromotedLink. The prefixTrackingCode must be in\
        \ a valid url form and must end with some parameter followed by an equals sign. Use the value \"EMPTY_PREFIX\" to\
        \ delete.\n\n- \ncpcPerAdEnabled (deprecation date 20.4.20) - Indicates whether or not the 'Cpc Per Ad' feature is\
        \ enabled for this campaign.\n\n- \nblockedSites - The publishers / sections which should be blocked. Note that this\
