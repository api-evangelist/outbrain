    put:
      operationId: updateBudgetsId
      summary: Update an existing Budget
      description: "To update a Budget send a JSON with the updated value for one or more of the updatable Budget attributes.\n\
        \nAll attribute values left unset in this PUT will remain unchanged.\n\nOnly the following Budget properties are updatable:\n\
        \n- \namount - The amount must be lower than the maximumAmount.\nA budget's minimum amount limit is determined by\
        \ its type:\n\nDAILY - more than 25\n\nMONTHLY - more than 750\n\nCAMPAIGN - The campaign's days amount multiplied\
        \ by 25\n\n- \nstartDate - The start date cannot be in the past. Start date cannot be modified after budget has started\
        \ (ie: start date already passed)\n\n- \nendDate - The end date must be after the start date, and cannot be in the\
        \ past.\n\n- \nrunForever - If set to 'true', the 'endDate' attribute should not be included as it is meaningless.\n\
        The current 'endDate' attribute of the Budget (if exists) will be discarded.\nIn case of passing 'false', 'endDate'\
        \ attribute must be also passed.\n\n- \ndailyTarget - The maximum amount of spend that is allowed per day. Relevant\
        \ only if DAILY_TARGET pacing is used.\n\n- \ntype - Allows to move between different budget types.\n\n- \npacing\
        \ - Allows to move between different pacing types (dailyTarget paramenter have to be set when moving to DAILY_TARGET\
        \ pacing)."
      tags:
      - Budgets
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: the Budget id
        example: 00f4b02153ee75f3c9dc4fc128ab041962
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              amount: 5000.0
              endDate: '2013-11-16'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
              example:
                id: 00f4b02153ee75f3c9dc4fc128ab041962
                name: Boost 'ABC' Brand budget
                shared: false
                amount: 100.0
                currency: USD
                amountRemaining: 100.0
                amountSpent: 0.0
                creationTime: '2013-10-16 12:24:01'
                lastModified: '2013-10-16 12:24:01'
                startDate: '2013-11-16'
                runForever: false
                type: CAMPAIGN
                pacing: DAILY_TARGET
                dailyTarget: 200.0
                maximumAmount: 200.0
          headers:
            AMPLIFY-REQUEST-ID:
              description: Request correlation / rate-limit signal
              schema:
                type: string
