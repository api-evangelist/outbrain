                    totalSumValue: 0
                    sumValue: 0
                    viewSumValue: 0
                    totalAverageValue: 0
                    averageValue: 0
                    viewAverageValue: 0
                    roas: 0
                    totalRoas: 0
                - metadata:
                    id: 00692bb1cca92269ad4ae1f793a0aa77ac
                    name: News > Politics
                    targetingStatus: partiallyTargeted
                  metrics:
                    impressions: 688402.0
