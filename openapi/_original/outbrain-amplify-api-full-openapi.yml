  /reports/marketers/{id}/periodic:
    get:
      operationId: getReportsMarketersIdPeriodic
      summary: Retrieve periodic performance statistics for a Marketer
      description: 'The API in this sub-section allows retrieving performance statistics by periodic breakdown at different
        levels: marketer, budget, campaign and promoted link.


        Special request parameters


        Parameter

        Type

        Semantic

        Details


        breakdown

        String

        Defines the periodic breakdown of data, either daily, weekly, monthly, hourOfDay, dayOfWeek or dayOfWeekByHour.

        Optional, default value daily.


        promotedLinkId

        String

        Limit to data of the promoted link with given ID.

        Optional, takes precedence over budgetId and campaignId. Not allowed with hourOfDay or dayOfWeekByHour breakdown.


        Result fields

        Metrics in metrics, metadata in a metadata object containing the following fields:


        Property

        Type

        Supported Breakdowns

        Semantic


        id

        String

        All

        date range identifier (month in format ''yyyy-MM'' or start date in format ''yyyy-MM-dd'', or day of week and hour
        in format ''d-HH'')


        fromDate

        Date

        daily, weekly, monthly

        The first day of the result date period.


        toDate

        Date

        daily, weekly, monthly

        The last day of the result date period (inclusive).


        lastCappingTime

        Time portion of Time, in format "HH:mm:ss".

        daily for a single campaign.

        Optional.  The time the campaign was capped during that date. Data is available for up to 30 days ago.


        hourOfDay

        String

        hourOfDay, dayOfWeekByHour

        The day of the week (Monday, Tuesday, etc.) of the result period.


        dayOfWeek

        Hour Of Day

        dayOfWeek, dayOfWeekByHour

        The hour of day of the result period.


        cpcAdjustment

        Number

        dayOfWeekByHour

        CPC adjustment bid of this day and hour for campaign given by the campaignId parameter (optional).


        enabled

        Boolean

        dayOfWeekByHour

        The scheduling status of this day and hour for campaign given by the campaignId parameter (optional).'
      tags:
      - Performance Reporting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Marketer id
        example: abf4b02153ee75f3cadc4fc128ab0419ab
      - name: from
        in: query
        required: true
        schema:
          type: string
        description: Start day Date
        example: '2015-12-22'
      - name: to
        in: query
        required: true
        schema:
          type: string
        description: End day Date
        example: '2016-01-20'
      - name: limit
        in: query
        required: false
        schema:
          type: number
        description: Number of results to return in this request. Used with offset for pagination. default is 10.
        example: '10'
      - name: offset
        in: query
        required: false
        schema:
          type: number
        description: Result number to start this response at. zero based. Used with limit for pagination. default is 0.
        example: '3'
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: Can have one of the following values impressions, clicks, ctr, spend, ecpc, conversions, conversionRate,
          cpa, id, fromDate and toDate. For more details about reports filtering read this.
        example: -ctr
      - name: filter
        in: query
        required: false
