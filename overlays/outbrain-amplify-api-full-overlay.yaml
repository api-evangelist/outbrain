        note: >
          Outbrain publishes no idempotency key or safe-retry contract. Bulk operations
          (multiplePromotedLinks, PUT /campaigns) are the documented alternative to retrying singles.
  - target: $.info
    update:
      x-rate-limits:
        login: 2 requests per hour per user
        token: 30 requests per second
        performance_reporting: 30 requests per minute per marketer
        realtime_reporting: 50 requests per minute per marketer
        exhaustion_status: 429
        response_header: rate-limit-msec-left
