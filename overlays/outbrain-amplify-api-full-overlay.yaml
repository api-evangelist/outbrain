x-method: generated
x-source: >
  Enhancements derived from conventions/outbrain-conventions.yml, rate-limits/outbrain-rate-limits.yml,
  errors/outbrain-problem-types.yml and lifecycle/outbrain-lifecycle.yml. The underlying OpenAPI is a
  faithful transcription of Outbrain's own Apiary blueprint and is never mutated.
actions:
  - target: $.info
    update:
      x-apievangelist-source: https://amplifyv01.docs.apiary.io/
