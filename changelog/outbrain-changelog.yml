    component: Teads iOS SDK
    version: 6.2.0
    breaking: true
    highlights:
      - 'Breaking: TeadsAdPlacementType gained a new banner case, requiring exhaustive switch handling.'
      - Added anchored banner placement, a floor price API, GPP section id reading, no-fill handling and binary distribution of mediation adapters.
