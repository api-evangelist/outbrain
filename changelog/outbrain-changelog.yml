source: >
  https://amplifyv01.docs.apiary.io/ ("Updates" section of the Outbrain-owned Apiary blueprint,
  document last updated 2026-08-13), https://developers.teads.com/docs/iOS-SDK/Getting-Started/release-notes
  and https://developers.teads.com/docs/Chatbot-AI-SDK/News/release-notes
description: >
  Outbrain (Teads) maintains two separate dated change surfaces and no single unified changelog.
  API behaviour changes are published as dated entries inside the Amplify API reference itself;
  SDK changes are published as per-platform release notes on the Teads Developer Portal. Both are
  captured here as a recent window — the live pages remain the source of truth.
