api_entries:
  - date: '2026-08-13'
    api: Outbrain Amplify API
    type: addition
    breaking: false
    title: 'New: Brand Logo'
    highlights:
      - A logoMetadata field was added to the Marketer entity.
      - The same field is available on the PromotedLink entity via extraFields=LogoMetaData, so an individual ad can carry its own logo.
  - date: '2026-02-01'
    api: Outbrain Amplify API
    type: addition
    breaking: false
    title: 'New: Section Volume Control for CBS Campaigns'
    highlights:
      - A volumeControl object was added to the Campaign entity.
      - Lets advertisers raise or lower traffic from individual sections on Conversion Bid Strategy Auto mode campaigns (tROAS, tCPA, Max Conversion) using their own external data.
  - date: '2026-01-04'
    api: Outbrain Amplify API
    type: addition
    breaking: false
    title: Enhanced publisher and section exclusion experience
    highlights:
      - A new optional expiration field was added to blockedPublishers and blockedSections under blockedSites, enabling temporary rather than permanent blocks.
      - Temporary exclusions auto-expire and reintroduce inventory without an alert.
      - Permanently blocked sections can now be re-activated by updating their settings.
      - Duplicated campaigns inherit the original campaign's exclusion states.
      - Exclusions uploaded via CSV remain permanent; the expiration field is not yet supported in CSV uploads.
  - date: '2025-10-16'
    api: Outbrain Amplify API
    type: breaking
    breaking: true
    effective: '2025-11-03'
    title: Minimum campaign budget increased
    highlights:
      - 'POST /budgets now enforces: type DAILY requires amount >= 25 USD (up from 20).'
      - 'type MONTHLY requires amount >= 750 USD.'
      - 'type CAMPAIGN requires amount >= 25 x number of campaign days.'
      - PUT /budgets applies the same enforcement to campaigns created on or after 2025-11-03.
      - Existing campaigns with budgets under 25 USD continue to run unchanged.
      - Daily minimums for other currencies are exposed via GET /currencies.
  - date: '2025-07-08'
    api: Outbrain Amplify API
    type: addition
    breaking: false
    title: 'New performance report endpoint: marketers report'
    highlights:
      - Performance reporting can now be aggregated by marketer using a primary account id.
      - The primary account id is obtained from the Marketer entity with extraFields=Account.
      - 'Endpoint: GET /reports/accounts/{primaryAccountId}/marketers.'
  - date: '2024-12-22'
    api: Outbrain Amplify API
    type: behaviour-change
    breaking: true
    effective: '2025-01-31'
    title: 'New reporting filter: enabledCampaignsOnly'
    highlights:
      - An enabledCampaignsOnly filter was added across the reporting endpoints (promoted content, periodic, publishers, sections).
      - Default was false at announcement and was scheduled to change to true by end of January 2025 — a silent result-set change for integrations that do not set it explicitly.
  - date: '2024-09-22'
    api: Outbrain Amplify API
    type: addition
    breaking: false
    title: 'New recommendation field for CBS Auto mode campaigns: maxCpcRecommendation'
    highlights:
      - Exposes whether the optimisation algorithm wants to bid above the campaign's specified max average CPC.
