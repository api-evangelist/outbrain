    registry: npm
    name: teads-react-native
    url: https://www.npmjs.com/package/teads-react-native
    install: npm install --save teads-react-native
    official: true
    version: 6.2.0
    published: '2026-06-22'
    source_code: https://github.com/teads/TeadsSDK-ReactNative
    docs: https://developers.teads.com/docs/React-Native-SDK/Getting-Started/installation
    note: Current first-party React Native SDK. Version tracks the native iOS/Android SDK train.
  - language: javascript
