    docs: https://developers.teads.com/docs/iOS-SDK/Getting-Started/installation
    note: >
      124 published versions on the CocoaPods trunk. Also consumable via Swift Package Manager from
      https://github.com/teads/TeadsSDK-iOS.git (.upToNextMajor(from "6.2.0")) and as a manually
      downloaded TeadsSDK.xcframework.
  - language: swift
