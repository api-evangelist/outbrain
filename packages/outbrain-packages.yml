method: searched
source: >
  npm registry metadata (registry.npmjs.org), CocoaPods trunk API, the Teads Artifactory Maven
  repository (teads.jfrog.io) named by the Teads Android SDK install docs, and the install pages of
  the Teads Developer Portal (developers.teads.com).
description: >
  Outbrain / Teads ships client libraries on the publisher / app-monetization side of its business —
  mobile and cross-platform SDKs that render Teads and Outbrain ad placements. There is no
  first-party server-side client library for the Amplify API (campaign management) or for the Teads
  Report API in any package registry; both are documented as plain HTTP + JSON only. The Android SDK
  is distributed from a Teads-operated Artifactory repository rather than Maven Central, so it has no
  Maven Central metadata endpoint; the version below is read from that repository's maven-metadata.xml.
packages:
