source: >
  https://developers.teads.com/docs/Android-SDK/Getting-Started/test-pids,
  https://developers.teads.com/docs/iOS-SDK/Getting-Started/test-pids,
  https://amplifyv01.docs.apiary.io/ (Apiary mock/proxy service) and
  https://my.outbrain.com/create-token
description: >
  Outbrain (Teads) publishes no test-mode credential separation for the Amplify API — there is no
  sandbox account, no test key prefix and no live/test toggle; API calls run against production
  data with a production OB-TOKEN-V1 token. What it does publish is a rich set of magic test
  placement identifiers on the ad-rendering side, so a publisher can prove an SDK integration
  renders every creative shape without buying inventory. That, plus the Apiary mock server, is the
  whole test surface. Every value below is published by Teads verbatim.
test_live_separation:
  supported: false
  key_prefixes: null
  note: >
    One token type (OB-TOKEN-V1) against one base URL (https://api.outbrain.com/amplify/v0.1). No
    test mode is documented for the Amplify API or the Teads Report API.
mock_server:
  provider: Apiary
  url: https://private-anon-42f82d8b12-amplifyv01.apiary-mock.com
  proxy: https://private-anon-42f82d8b12-amplifyv01.apiary-proxy.com
  note: >
    Apiary generates a mock server from Outbrain's own published blueprint that replays the
    documented example responses. The host segment is a per-visitor anonymous traffic token, not a
    stable Outbrain endpoint — useful for contract testing, not a provider-operated sandbox.
