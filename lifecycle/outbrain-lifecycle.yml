support:
  - channel: Google Group (Amplify API)
    url: https://groups.google.com/g/outbrain-amplifyapi
    note: >
      Outbrain's documented troubleshooting path. Support asks for the AMPLIFY-REQUEST-ID response
      header value when reporting a problem.
  - channel: Teads API email
    url: mailto:api@teads.tv
  - channel: Teads support centre
    url: https://support.teads.com
  - channel: Outbrain help centre
    url: https://www.outbrain.com/help/
data_freshness:
  note: >
    The Amplify API exposes its own reporting freshness contract as operations rather than as an SLA
    document — GET /reports/dataFreshness and GET /reports/fullDay tell a caller how current the
    reporting warehouse is.
  operations:
    - openapi/outbrain-amplify-api-full-openapi.yml#getReportsDataFreshness
    - openapi/outbrain-amplify-api-full-openapi.yml#getReportsFullDay
