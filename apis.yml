- aid: outbrain:outbrain-multiple-conversions-api
  name: Outbrain Multiple Conversions API
  description: >-
    Multiple Conversions gives the ability to track any of the actions a user takes after clicking through
    to your content.

    You can track everything from top of funnel (page landings and time on site) to bottom of funnel (e-book
    downloads and product purchases).


    Please note: This new feature requires the installation of the new multiple conversion pixel which
    can be retrieved from your account on Outbrain.com.  If you have the old conversion pixel placed you
    will need to remove that before installing the Multiple Conversion Pixel.  If both pixels are installed
    there will be overcounting of data and results will be inaccurate.
  humanURL: https://developer.outbrain.com/home-page/amplify-api/
  baseURL: https://api.outbrain.com/amplify/v0.1
