- aid: outbrain:outbrain-amplify-api
  name: Outbrain Amplify API
  description: >
    The complete Outbrain Amplify API surface — 77 operations across marketers, budgets, campaigns,
    promoted links and promoted-link sequences, audience segments, conversion events, user and
    invitation management, geo / interest / IAB-category targeting, section and currency metadata,
    and 23 performance-reporting projections. Transcribed faithfully from Outbrain's own Apiary
    blueprint, which Outbrain last updated 2026-08-13.
  humanURL: https://amplifyv01.docs.apiary.io/
  baseURL: https://api.outbrain.com/amplify/v0.1
  tags:
  - Advertising
  - Campaign Management
  - Reporting
  - Native Advertising
  properties:
  - type: OpenAPI
    url: openapi/outbrain-amplify-api-full-openapi.yml
  - type: Overlay
    url: overlays/outbrain-amplify-api-full-overlay.yaml
  - type: APIReference
    url: https://amplifyv01.docs.apiary.io/
  - type: Documentation
    url: https://developer.outbrain.com/home-page/amplify-api/documentation/
  - type: SignUp
    url: https://www.outbrain.com/partner-api/
- aid: outbrain:outbrain-teads-report-api
  name: Teads Report API
  description: >
    Asynchronous analytics reporting for the Teads platform. A POST triggers a report that is
    computed in the background; a GET polls its status and returns a download URL for the finished
    CSV, JSON or XLSX. Covers publisher, programmatic, campaign, temporal and audience dimensions
    with integration, tracking, interaction, programmatic and finance metric families. OAuth bearer
    authentication, two concurrent reports, fifty reports per rolling 24 hours.
  humanURL: https://teadsapi.docs.apiary.io/
  baseURL: https://api.teads.tv/v1/analytics
  tags:
  - Reporting
  - Analytics
  - Advertising
  properties:
  - type: OpenAPI
    url: openapi/outbrain-teads-report-api-openapi.yml
  - type: Overlay
    url: overlays/outbrain-teads-report-api-overlay.yaml
  - type: APIReference
    url: https://teadsapi.docs.apiary.io/
  - type: ErrorCodes
    url: errors/outbrain-error-codes.yml
  - type: Support
    url: mailto:api@teads.tv
- aid: outbrain:outbrain-teads-in-chat-api
  name: Teads In-Chat API
  description: >
    Contextual sponsored-recommendation API for chatbot and LLM publishers, backing the Teads
    Conversational AI Ads SDK (public beta since 2025-11-12). Takes a partner key plus one of
    contentUrl / bundleUrl / portalUrl, a widgetJSId placement identifier and optional keywords,
    IAB categories or free-text chat context, and returns recommendation sets grouped by engine
    with tracking pixels and optional display creative.
  humanURL: https://developers.teads.com/docs/Chatbot-AI-SDK/Getting-Started/integration-guide
  baseURL: https://mv.outbrain.com/Multivac/api/in-chat-recs
