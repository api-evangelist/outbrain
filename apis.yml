- aid: outbrain:outbrain-authentications-api
  name: Outbrain Authentications API
  description: >-
    Token

    Obtaining a token should be your 1st step toward using Amplify API. You need to include it in all
    further requests using the HTTP Header OB-TOKEN-V1.

    In order to protect your privacy, the tokens are valid for a period of 30 days. You will not be able
    to access Amplify API using an expired token.

    You can generate as many tokens as you wish. Generating a new token does not invalidate older tokens.

    When a user password or email are changed in the Create Token Page all tokens

    generated prior to the change are revoked and a new token must be generated.


    How to obtain a token ?

    There are 2 ways to obtain a token


    via web interface

    Simply go to your Amplify API Token Page, fill in your password, hit generate, and you will get your
    token.

    If you can't see Amplify API Token form, this means that your username doesn't have access to the
    Amplify API. To register for the Amplify API please fil
  humanURL: https://developer.outbrain.com/home-page/amplify-api/
  baseURL: https://api.outbrain.com/amplify/v0.1
