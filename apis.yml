- aid: outbrain:outbrain-performance-reporting-api
  name: Outbrain Performance Reporting API
  description: >-
    There are a multitude of reporting endpoints that allow you to retrieve metrics at various levels
    of granularity.


    Note: All performance reports have a 10-30 minutes delay, therefore performance metrics that include
    the current day are partial.


    Rate Limits

    Each marketer is limited to 30 requests per minute for the entire performance reporting API. In case
    of rate limit violation the response status will be 429 (Too Many Requests).


    As of April 12, 2021 performance reporting is limited to a history of 3 years per data request.


    Response structure

    All reporting endpoints share a common response structure, defined below:


    Property

    Type

    Semantic

    Comments


    results

    Array

    Metadata and Metrics of the entities returned.

    Metadata is an object containing contextual properties of the report entity. The set of properties
    is specific for each end-point.


    totalResults

    Number

    Count of the total results
