- aid: outbrain:outbrain-segments-api
  name: Outbrain Segments API
  description: >-
    Segments give the ability to segment customers based on their actions, and retarget them with new
    or existing campaigns. This translates into your campaigns reaching a highly engaged audience that
    is more likely to convert and fulfill your brand's goals. With this functionality you'll be able to
    segment customers in two ways: Audience Retargeting (Type: PIXEL) and Story Sequencing (Type: CLICKERS).


    Please note: The PIXEL feature requires the installation of the Outbrain Custom Audience pixel, which
    can be retrieved from your account on Outbrain.com.  If you have the old audience pixel installed,
    you will need to remove that before installing the new pixel.  For additional information regarding
    obtaining and installing the pixel properly, please visit our help center here: http://help.outbrain.com/customer/en/portal/articles/2809479-how-can-i-create-custom-audiences
