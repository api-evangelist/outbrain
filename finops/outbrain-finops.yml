specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Outbrain (Teads)
providerId: outbrain
created: '2026-05-25'
modified: '2026-05-25'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Advertising
  - Open Web
  - CTV
description: >
  FOCUS-aligned FinOps definition for advertiser spend on the combined Outbrain /
  Teads open-internet platform. Costs are auction-driven (CPC / CPM / CPV / CPCV)
  and surfaced via the Amplify reporting API. There is no traditional cloud
  billing surface — advertiser spend itself is the metered usage.
sources:
  - https://developer.outbrain.com/home-page/amplify-api/documentation/
  - https://www.outbrain.com/partner-api/
  - https://www.teads.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Outbrain Inc. (NASDAQ&#58; OB) operating as Teads
serviceCategory: Advertising and Marketing
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Adjustment
    - Credit
    - Tax
  primaryUnit: click
  secondaryUnits:
    - impression
    - view
    - completed view
    - conversion
costAllocation:
  dimensions:
    - marketer
    - campaign
    - promotedLink
    - country
    - platform
    - dayOfWeek
  reportingEndpoints:
    - /reports/marketers/{marketerId}/campaigns
    - /reports/marketers/{marketerId}/periodicContent
    - /reports/marketers/{marketerId}/realtime
optimizationLevers:
  - Auction bid (CPC) tuning per campaign
  - Audience and contextual targeting refinement
  - Creative rotation and dynamic optimization (Amplify Conversion Bid Strategy)
  - Predictive AI campaign optimization (Teads)
  - Shared budgets across campaigns
  - PMP deals vs open exchange (Teads CTV)
  - Server-side Conversion API for cookieless attribution
notes: >
  The combined company trades as NASDAQ&#58; OB and operates publicly under the
  Teads brand. Financial reporting consolidates open-web native (Outbrain
  Amplify), premium video, and CTV (Teads) into a single ex-TAC gross profit
  view. Advertiser FinOps disciplines apply at the campaign / promoted-link
  level via the Amplify reporting endpoints above.
